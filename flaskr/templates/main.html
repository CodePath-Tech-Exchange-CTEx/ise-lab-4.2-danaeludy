<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block page_name %}{{ page_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="site-title">Cats on Skis Wiki</div>
            <div class="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('all_pages') }}">Pages</a>
                <a href="{{ url_for('about') }}">About</a>
            </div>
        </div>
    </nav>

    <main class="page-container">
        <section class="content-card">
            {% block content %}
                <h1 class="page-title">{{ page_name }}</h1>
                <p>{{ page_content }}</p>
            {% endblock %}
        </section>
    </main>
</body>
</html>
